# LP 仪表盘安全响应头 —— 在【每个】需要的 location 内 include (2026-09-28 审计修复)
# nginx 的 add_header 只在「本级没有任何 add_header」时才从上级继承, 所以不能只写在 server 级;
# always => 401/302/429 等非 2xx 响应也带。/1888/ 只 include 这份 (不含 CSP, 那个看板可能用外部 CDN 脚本)。
# HSTS 只对 https 响应有意义, 浏览器对 http 响应里的 HSTS 头会忽略, 所以 80 回源也放着无害。
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
