# ============================================================================
#  LP 仪表盘 (5179) + V4 Hook 看板 (1888)
#  入口: __SERVER_IP__ (IP 直连, 只 301 到子域) 与 lp.fucklp.com
#
#  2026-09-09 鉴权由 nginx Basic Auth 弹窗改为【登录页模式】。
#  把关的仍然是 nginx —— 5179/1888 只监听 127.0.0.1, nginx 是唯一入口。
#  没有正确 cookie 的请求在这里就被拦下 (页面 302 到 /login, API 返 401),
#  根本到不了应用进程。应用侧 (lp-auth.js) 只负责校验用户名口令并下发 cookie。
#  这样保留了「失败即锁死」而非「失败即敞开」的失效方向。
#
#  与 stock./meme. 那套登录【完全独立】(用户要求账号密码不通用):
#  独立用户库 auth-users-lp.json、独立 cookie(lpauth, 不带 Domain 故 host-only)。
#
#  2026-09-28 审计修复 (本文件): 令牌搬出仓库 (include lp-token.map); IP 直连整站 301 到子域;
#  server_tokens off + 安全头/CSP snippet; 登录接口 limit_req; Cloudflare 真实 IP 还原。
#  依赖的服务器文件: /etc/nginx/lp-token.map (0600 root, 由 tools/rotate-lp-token.sh 渲染),
#  snippets/lp-secheaders.conf、lp-csp.conf、cloudflare-realip.conf (本目录都有快照)。
# ============================================================================
map_hash_bucket_size 128;

# 2026-09-28 审计修复: 令牌不再明文写在本文件 (会随仓库快照外泄)。map $cookie_lpauth $lp_ok 整块搬到
# /etc/nginx/lp-token.map (0600 root), 仓内只留 deploy/nginx/lp-token.map.example 占位版; 轮换用 tools/rotate-lp-token.sh
include /etc/nginx/lp-token.map;

# 2026-09-28 审计修复: 登录接口按来源 IP 限速 (6 次/分钟, 允许突发 6, 超出直接 429), 与应用层「8 次锁 15 分钟」互补,
# 暴力尝试先在 nginx 被挡掉。zone 必须定义在 http 级 (即本文件顶层), 经 realip 还原后 $binary_remote_addr 是真实客户端 IP
limit_req_zone $binary_remote_addr zone=lplogin:1m rate=6r/m;

# ------------------------------------------------------------ IP 直连入口
# 2026-09-28 审计修复: IP 直连只有 80 (明文), 不再在这里提供登录页 / 反代任何内容, 整站 301 到 https 子域。
# 这条入口不经 CF, 不存在 Flexible 模式的重定向循环问题 (那条顾虑只针对 lp.fucklp.com 自己的 80 监听)。
# 原来的 /stocks.html、/memes.html 老入口跳转搬到了下面 lp.fucklp.com 块 (经这里 301 过去后仍能到 stock./meme.)。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/lp-dashboard.access.log;
    error_log  /var/log/nginx/lp-dashboard.error.log;

    return 301 https://lp.fucklp.com$request_uri;
}

# ------------------------------------------------------- lp.fucklp.com 入口
# 端口 80 监听保留: CF 回源可能走 80 (加密模式 Flexible), 源站不做 http->https 跳转以免循环; 访客侧 https 由 CF 边缘强制。
server {
    listen 80; listen [::]:80;
    listen 443 ssl; listen [::]:443 ssl;
    server_name lp.fucklp.com;
    include /etc/nginx/snippets/fucklp-ssl.conf;

    # 2026-09-28 审计修复: 不暴露 nginx 版本号; 还原 CF 回源的真实客户端 IP ($remote_addr / X-Real-IP / 限速 / 日志都用它)
    server_tokens off;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # 链上刷新一轮可达数十秒，放宽超时避免 504
    proxy_connect_timeout 15s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    access_log /var/log/nginx/lp-dashboard.access.log;
    error_log  /var/log/nginx/lp-dashboard.error.log;

    # ---- 老入口收敛到子域名 (免鉴权, 否则变成「先输密码才肯跳转」; 2026-09-28 从 IP 直连块搬来) ----
    location = /stocks.html { return 301 https://stock.fucklp.com/; }
    location = /memes.html  { return 301 https://meme.fucklp.com/; }

    # ---- 公开: 登录页(静态, 不依赖应用) 与登录接口 ----
    # add_header 不会继承进「自己也有 add_header」的 location, 所以安全头 snippet 在每个需要的 location 里各 include 一次
    location = /login {
        root /var/www/lp-login;
        try_files /index.html =404;
        include /etc/nginx/snippets/lp-secheaders.conf;   # 2026-09-28 审计修复: 安全头
        include /etc/nginx/snippets/lp-csp.conf;          # 2026-09-28 审计修复: CSP (登录页与仪表盘同源 + Google Fonts)
    }
    location = /api/lp-auth/login {
        limit_req zone=lplogin burst=6 nodelay;           # 2026-09-28 审计修复: 登录限速
        limit_req_status 429;
        include /etc/nginx/snippets/lp-secheaders.conf;   # 2026-09-28 审计修复: 安全头
        proxy_pass http://127.0.0.1:5179;
        include /etc/nginx/snippets/fucklp-proxyhdr.conf;
    }
    location = /api/lp-auth/logout {
        include /etc/nginx/snippets/lp-secheaders.conf;   # 2026-09-28 审计修复: 安全头
        proxy_pass http://127.0.0.1:5179;
        include /etc/nginx/snippets/fucklp-proxyhdr.conf;
    }

    # ---- API: 未登录返 401, 不要 302 到 HTML (前端 fetch 拿到一坨 HTML 极难排查) ----
    location ^~ /api/ {
        if ($lp_ok = 0) { return 401; }
        include /etc/nginx/snippets/lp-secheaders.conf;   # 2026-09-28 审计修复: 安全头 (always => 401 也带)
        proxy_pass http://127.0.0.1:5179;
        include /etc/nginx/snippets/fucklp-proxyhdr.conf;
    }

    # ---- V4 Hook 看板 (可能用外部 CDN 脚本: 只加安全头, 不加 CSP) ----
    location = /1888 { return 301 /1888/; }
    location /1888/ {
        if ($lp_ok = 0) { return 302 /login?next=$request_uri; }
        include /etc/nginx/snippets/lp-secheaders.conf;   # 2026-09-28 审计修复: 安全头
        proxy_pass http://127.0.0.1:1888/;
        include /etc/nginx/snippets/fucklp-proxyhdr.conf;
    }

    # ---- 仪表盘本体 ----
    location / {
        if ($lp_ok = 0) { return 302 /login?next=$request_uri; }
        include /etc/nginx/snippets/lp-secheaders.conf;   # 2026-09-28 审计修复: 安全头
        include /etc/nginx/snippets/lp-csp.conf;          # 2026-09-28 审计修复: CSP
        proxy_pass http://127.0.0.1:5179;
        include /etc/nginx/snippets/fucklp-proxyhdr.conf;
    }
}
