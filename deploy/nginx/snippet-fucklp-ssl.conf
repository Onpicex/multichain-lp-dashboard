# Cloudflare Origin CA 证书 (SAN: fucklp.com + *.fucklp.com, 2041 到期)
# 私有 CA 签发 => 必须配合 CF 代理(橙云)开启, 灰云直连会报证书不受信任
ssl_certificate     /etc/ssl/certs/fucklp-origin.pem;
ssl_certificate_key /etc/ssl/private/fucklp-origin.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSLfucklp:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
