# stock./meme. 两个子域共用的路径。
# 鉴权在应用层做, nginx 这里不设 auth_basic:
#   未登录访问页面 -> 应用 302 到 /login; 访问 /api/* 或 /c/* -> 应用返回 401 JSON。
location = /login {
    proxy_pass http://127.0.0.1:5180;
    include /etc/nginx/snippets/fucklp-proxyhdr.conf;
}
location ^~ /api/ {
    proxy_pass http://127.0.0.1:5180;
    include /etc/nginx/snippets/fucklp-proxyhdr.conf;
}
# /c/<chain>/... -> meme-chains (5181): Base / BNB Chain 的 meme 数据。
# 独立进程, 与 5180 零共享 (只读同一把 stkauth 签名密钥做校验, 从不签发 cookie)。
# rh 的数据仍然走上面的 /api/ -> 5180, 这条路由碰不到它。
# 插到 /etc/nginx/snippets/fucklp-app.conf 里 `location ^~ /c/ { ... 5181 }` 之前。
# nginx 的 ^~ 前缀匹配取最长者, 所以这两条比 /c/ 优先; rh 的 /api/ → 5180 与 meme-chains 的 /c/<其他> → 5181 都不受影响。
# /c/solstock/... 与 /c/solpre/... -> sol-stocks (5183): Solana 代币化美股两个视图。
# 独立进程, 与 5180 / 5181 零共享 (只读同一把 stkauth 签名密钥做校验, 从不签发 cookie)。
location ^~ /c/solstock/ {
    proxy_pass http://127.0.0.1:5183;
    include /etc/nginx/snippets/fucklp-proxyhdr.conf;
}
location ^~ /c/solpre/ {
    proxy_pass http://127.0.0.1:5183;
    include /etc/nginx/snippets/fucklp-proxyhdr.conf;
}
# /c/solmeme/... -> sol-stocks (5183): Solana Meme 自选视图 (meme.fucklp.com 的 Solana 页签, 2026-09-27)。
# 2026-09-28 审计修复: 仓内快照补上服务器 09-27 已加的这块 (之前快照缺, 重建会丢 Solana 页签)
location ^~ /c/solmeme/ {
    proxy_pass http://127.0.0.1:5183;
    include /etc/nginx/snippets/fucklp-proxyhdr.conf;
}

location ^~ /c/ {
    proxy_pass http://127.0.0.1:5181;
    include /etc/nginx/snippets/fucklp-proxyhdr.conf;
}
location = /favicon.ico { access_log off; return 204; }
# 需登录的站点不希望被搜索引擎收录
location = /robots.txt { access_log off; default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
