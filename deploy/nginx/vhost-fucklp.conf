# ============================================================================
#  fucklp.com 域名族  ——  2026-09-09 重构为多子域
#
#    fucklp.com        导航页 (公开, nginx 静态托管, 不依赖任何 node 进程)
#    stock.fucklp.com  股票代币页   -> 5180, 应用层登录 (auth.js)
#    meme.fucklp.com   Meme 自选页  -> 5180, 与 stock 共用同一套账号
#    lp.fucklp.com     LP 仪表盘    -> 见 sites-available/lp-dashboard
#                                      (它有自己独立的 Basic Auth, 与本套无关,
#                                       server 块与 map 放在一起便于维护)
#
#  证书 SAN 覆盖 *.fucklp.com, 加子域无需重签。
#  端口 80 故意【不】做 301 跳 https —— 若 CF 加密模式被误设成 Flexible,
#  源站跳 https 会造成无限重定向循环。访客侧 http->https 由 CF 边缘
#  「始终使用 HTTPS」完成 (已开启)。
# ============================================================================

# 日志带 :$server_port/$scheme —— 用来判定 CF 回源走的是 80(明文) 还是 443(加密)
log_format fucklp '$remote_addr [$time_local] ":$server_port/$scheme" "$host" "$request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time cf_ip="$http_cf_connecting_ip" "$http_user_agent"';

# 未知 SNI / 直接扫 IP:443 -> 拒绝握手, 不出示证书也不给内容
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
}

# ---------------------------------------------------------------- 导航页 (公开)
server {
    listen 80; listen [::]:80;
    listen 443 ssl; listen [::]:443 ssl;
    server_name fucklp.com;
    include /etc/nginx/snippets/fucklp-ssl.conf;

    access_log /var/log/nginx/fucklp.access.log fucklp;
    error_log  /var/log/nginx/fucklp.error.log;

    root /var/www/fucklp-home;
    index index.html;

    location = / { try_files /index.html =404; }
    location = /robots.txt { access_log off; default_type text/plain; return 200 "User-agent: *\nAllow: /\n"; }
    location = /favicon.ico { access_log off; return 204; }
    location / { return 404; }
}

# www -> apex
server {
    listen 80; listen [::]:80;
    listen 443 ssl; listen [::]:443 ssl;
    server_name www.fucklp.com;
    include /etc/nginx/snippets/fucklp-ssl.conf;
    return 301 https://fucklp.com$request_uri;
}

# ------------------------------------------------------------- 股票代币 (需登录)
server {
    listen 80; listen [::]:80;
    listen 443 ssl; listen [::]:443 ssl;
    server_name stock.fucklp.com;
    include /etc/nginx/snippets/fucklp-ssl.conf;

    access_log /var/log/nginx/fucklp.access.log fucklp;
    error_log  /var/log/nginx/fucklp.error.log;

    # 链上刷新一轮可达数十秒, 放宽超时避免 504
    proxy_connect_timeout 15s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # 根路径直出股票页 (地址栏保持干净)
    location = / {
        proxy_pass http://127.0.0.1:5180/stocks.html;
        include /etc/nginx/snippets/fucklp-proxyhdr.conf;
    }
    location = /stocks.html { return 302 /; }
    # 页面内那个 href="/memes.html" 的跳转链接 -> 送到 meme 子域 (前端零改动)
    location = /memes.html  { return 302 https://meme.fucklp.com/; }

    include /etc/nginx/snippets/fucklp-app.conf;
    location / { return 404; }
}

# --------------------------------------------------------------- Meme (需登录)
server {
    listen 80; listen [::]:80;
    listen 443 ssl; listen [::]:443 ssl;
    server_name meme.fucklp.com;
    include /etc/nginx/snippets/fucklp-ssl.conf;

    access_log /var/log/nginx/fucklp.access.log fucklp;
    error_log  /var/log/nginx/fucklp.error.log;

    proxy_connect_timeout 15s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    location = / {
        proxy_pass http://127.0.0.1:5180/memes.html;
        include /etc/nginx/snippets/fucklp-proxyhdr.conf;
    }
    location = /memes.html  { return 302 /; }
    # 页面内 href="/stocks.html" 的返回链接 -> 送到 stock 子域
    location = /stocks.html { return 302 https://stock.fucklp.com/; }

    include /etc/nginx/snippets/fucklp-app.conf;
    location / { return 404; }
}

# ------------------------------------------------------ BTC 期权 Gamma (需登录)
# 2026-09-22 新增 btc.fucklp.com -> 5182 (btc-gex)。鉴权在应用层: 5182 复用 rh 的
# stkauth 账号体系 (读同一份 auth-secret / auth-users.json), 未登录页面 302 /login,
# /api/* 返 401。不接入 fucklp.com 导航页。
server {
    listen 80; listen [::]:80;
    listen 443 ssl; listen [::]:443 ssl;
    server_name btc.fucklp.com;
    include /etc/nginx/snippets/fucklp-ssl.conf;

    access_log /var/log/nginx/fucklp.access.log fucklp;
    error_log  /var/log/nginx/fucklp.error.log;

    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    proxy_connect_timeout 15s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    location = /favicon.ico { access_log off; return 204; }
    location = /robots.txt { access_log off; default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location / {
        proxy_pass http://127.0.0.1:5182;
        include /etc/nginx/snippets/fucklp-proxyhdr.conf;
    }
}
