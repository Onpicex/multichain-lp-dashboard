# 反代公共头 —— 在 location 内 include
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# 2026-09-28 审计修复: 不把 CF-Connecting-IP 透传给应用 (客户端直连源站时可伪造); 真实 IP 由 realip 模块还原进 $remote_addr,
# 应用一律读 X-Real-IP (双保险: lp-auth.js 已改成只读 X-Real-IP)。各 CF 代理的 server 块须 include cloudflare-realip.conf
proxy_set_header CF-Connecting-IP  "";
proxy_buffering off;
